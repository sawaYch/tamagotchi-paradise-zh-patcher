[workspace]
resolver = "2"
members = [
    "crates/paradise-core",
    "crates/paradise-cli",
    "crates/paradise-gui",
    "crates/glyphpack-gen",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
encoding_rs = "0.8"
png = "0.18"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
