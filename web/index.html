<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Tamagotchi Paradise ZH Patcher</title>
    <link rel="icon" type="image/png" href="icon.png" />
    <link rel="apple-touch-icon" href="icon.png" />
    <meta
      name="description"
      content="Convert the Simplified Chinese text and font in your own Tamagotchi Paradise ROM to Traditional Chinese, entirely in your browser."
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1b1b1b;
        color: #ddd;
        font-family: system-ui, sans-serif;
      }
      #paradise_canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        text-align: center;
        padding: 1rem;
      }
    </style>
  </head>
  <body>
    <canvas id="paradise_canvas"></canvas>
    <div id="loading">Loading patcher...</div>
    <noscript>This tool needs JavaScript and WebAssembly.</noscript>
    <script type="module">
      import init from "./pkg/paradise.js";
      init().catch((e) => {
        const el = document.getElementById("loading");
        if (el) el.textContent = "Failed to load the patcher: " + e;
      });
    </script>
  </body>
</html>
